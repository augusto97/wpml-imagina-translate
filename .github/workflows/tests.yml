name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # The plugin header claims PHP 7.4, so it is tested on 7.4, not only on
    # whatever the runner happens to ship.
    name: Unitarios (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, json, libxml
          coverage: none
          tools: none

      - name: Lint de todos los ficheros PHP
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null || fail=1
          done < <(git ls-files '*.php')
          exit $fail

      - name: Tests unitarios
        run: php tests/run.php

  javascript:
    name: JavaScript y la interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Sintaxis de los .js y .cjs
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(git ls-files '*.js' '*.cjs')
          exit $fail
      # TypeScript estricto (tsc --noEmit) y el build de Vite: un error de
      # tipos o un import roto falla aquí, no en el sitio de un cliente.
      - name: Tipos y compilación de la interfaz
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

  integration:
    # The suite that found the defects unit tests could not: real WordPress,
    # real database, real HTTP. Run on the current WordPress, where the MCP
    # connection is exercised end to end with the official MCP SDK client,
    # and on one without the Abilities API, where it must switch itself off
    # cleanly while the rest of the plugin keeps working.
    name: Integración (WordPress ${{ matrix.wp }}, WPML ${{ matrix.wpml }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # WPML's documented hooks, answered by a test double.
          - wp: '7.1.2'
            wpml: doble
          - wp: '6.8.2'
            wpml: doble
          # The real WPML and String Translation, from the ZIPs kept on main.
          - wp: '7.1.2'
            wpml: real

    env:
      WIT_TEST_DIR: ${{ github.workspace }}/../wit-integration
      WIT_WP_VERSION: ${{ matrix.wp }}
      # Short and always writable: the kernel caps a UNIX socket path at 107
      # characters, and the runner is not root so /run/mysqld is out.
      WIT_DB_SOCKET: /tmp/wit-mysql.sock
      WIT_DB_DATADIR: /tmp/wit-mysql-data

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, json, libxml, curl, zip, mysqli, gd, intl, exif, fileinfo
          coverage: none
          tools: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tests/integration/client/package-lock.json
            admin-ui/package-lock.json

      - name: Instalar el cliente MCP de pruebas
        working-directory: tests/integration/client
        run: npm ci --no-audit --no-fund

      # The screens are React (admin-ui/); the suite loads them over HTTP and
      # in a browser, so they are built first, as the release ZIP does.
      - name: Compilar la interfaz
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Instalar Playwright y Chromium (sección M)
        run: |
          npm install -g --no-audit --no-fund playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium

      - name: Instalar MariaDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-server mariadb-client
          # setup.sh starts its own instance with its own datadir; the packaged
          # service would only compete for the port.
          sudo systemctl stop mariadb 2>/dev/null || true
          # Ubuntu's AppArmor profile confines mariadbd to /var/lib/mysql, and
          # the test instance keeps its data in the workspace. Relax it for
          # this throwaway runner only.
          # Ubuntu 26.04 names the profile after the binary alone.
          for profile in /etc/apparmor.d/usr.sbin.mariadbd /etc/apparmor.d/mariadbd /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/mysqld; do
            [ -f "$profile" ] && sudo apparmor_parser -R "$profile" 2>/dev/null && echo "AppArmor: $profile descargado"
          done
          mariadbd --version

      - name: Cachear WordPress y wp-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.WIT_TEST_DIR }}/cache
          key: wit-cache-wp${{ matrix.wp }}-wpcli2.11.0-elementor4.0.8

      - name: Obtener WPML real
        if: matrix.wpml == 'real'
        id: wpml
        run: |
          # WPML is not free, so it is never downloaded: it is the copy the
          # site owner keeps on the main branch. Without it, this job says so
          # and stops; it does not fail.
          mkdir -p "$RUNNER_TEMP/wpml"
          if git fetch -q --depth=1 origin main \
             && git show FETCH_HEAD:Wpml.zip > "$RUNNER_TEMP/wpml/Wpml.zip" 2>/dev/null \
             && git show FETCH_HEAD:String.zip > "$RUNNER_TEMP/wpml/String.zip" 2>/dev/null; then
            echo "WIT_WPML_ZIP=$RUNNER_TEMP/wpml/Wpml.zip" >> "$GITHUB_ENV"
            echo "WIT_WPML_ST_ZIP=$RUNNER_TEMP/wpml/String.zip" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=WPML real::Los ZIP de WPML no están en main; la prueba contra WPML real se omite."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir la instalación
        if: matrix.wpml != 'real' || steps.wpml.outputs.available == 'true'
        run: tests/integration/setup.sh

      - name: Ejecutar la suite
        if: matrix.wpml != 'real' || steps.wpml.outputs.available == 'true'
        run: tests/integration/run.sh

      - name: Registros en caso de fallo
        if: failure()
        run: |
          echo "=== debug.log ==="
          tail -60 "$WIT_TEST_DIR/www/wp-content/debug.log" 2>/dev/null || echo "(vacío)"
          echo "=== servidor PHP ==="
          tail -40 "$WIT_TEST_DIR/php-server.log" 2>/dev/null || echo "(sin log)"
          echo "=== MariaDB ==="
          tail -40 "$WIT_TEST_DIR/mysql.err" 2>/dev/null || echo "(sin log)"
          echo "=== instalación de MariaDB ==="
          cat "$WIT_TEST_DIR/mysql-install.log" 2>/dev/null || echo "(sin log)"
          sudo dmesg 2>/dev/null | grep -i apparmor | tail -10 || true
          echo "=== cadenas enviadas a la API ==="
          tail -20 "$WIT_TEST_DIR/www/wp-content/wit-ai-requests.log" 2>/dev/null || echo "(ninguna)"
          echo "=== cliente MCP ==="
          cat "$WIT_TEST_DIR/mcp-client.json" 2>/dev/null || echo "(no se ejecutó)"
          echo "=== navegador (sección M) ==="
          cat "$WIT_TEST_DIR/browser.log" 2>/dev/null || echo "(no se ejecutó)"

  package:
    # The ZIP is what actually gets installed on a client site, so it is built
    # and verified on every push rather than by hand at release time.
    name: Paquete instalable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      # build-zip.sh compiles admin-ui/ from HEAD and ships only its output.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Construir y verificar el ZIP
        run: tools/build-zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wpml-imagina-translate-zip
          path: dist/*.zip
          if-no-files-found: error
